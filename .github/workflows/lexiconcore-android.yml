name: Lexiconcore Android
on:
  push:
    branches: [lexiconcore-pro-a4]
    paths: ['android/**', '.github/workflows/lexiconcore-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build test APK and unsigned release bundle
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/Lexiconcore-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab delivery/Lexiconcore-unsigned.aab
          unzip -tq delivery/Lexiconcore-unsigned.aab
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs delivery/Lexiconcore-test.apk
          (cd delivery && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Lexiconcore-Android
          path: delivery/
          if-no-files-found: error
          retention-days: 30
